spring.application.name=gym-backend

# Load .env
spring.config.import=optional:file:./.env[.properties]

# Server
server.port=${SERVER_PORT:8080}

# Supabase
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}

# API security. Set APP_JWT_SECRET to a stable random value of at least 32 bytes.
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.jwt-expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:28800}
app.security.bootstrap-token=${APP_BOOTSTRAP_TOKEN:}
app.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
app.simulated-now=${APP_SIMULATED_NOW:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
