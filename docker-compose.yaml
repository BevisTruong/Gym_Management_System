services:
  backend:
    build:
      context: ./gym_backend
    env_file:
      - ./gym_backend/.env
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./gym_frontend/tv3-ui
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
